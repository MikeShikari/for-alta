<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Для самой-самой</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg1: #06070d;
      --bg2: #0c1020;
      --text: #f5f3f7;
      --muted: rgba(245, 243, 247, 0.72);
      --accent: #f3bfd3;
      --accent-2: #ffdceb;
      --button-bg: rgba(255, 220, 235, 0.14);
      --button-border: rgba(255, 220, 235, 0.28);
      --card-bg: rgba(12, 14, 24, 0.5);
      --card-border: rgba(255, 255, 255, 0.08);
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top, #11172b 0%, #090b12 45%, #05060a 100%);
      color: var(--text);
      font-family:
        "Segoe UI",
        "Helvetica Neue",
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(132, 98, 163, 0.16), transparent 30%),
        radial-gradient(circle at 75% 15%, rgba(255, 192, 203, 0.08), transparent 28%),
        radial-gradient(circle at 50% 85%, rgba(71, 90, 170, 0.12), transparent 35%);
      pointer-events: none;
      z-index: 0;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      isolation: isolate;
    }

    .moon {
      position: absolute;
      top: 72px;
      right: 110px;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fffdf6 0%, #f7eed9 45%, #d4c7b4 100%);
      box-shadow:
        0 0 30px rgba(255, 244, 214, 0.28),
        0 0 80px rgba(255, 244, 214, 0.12);
      opacity: 0.92;
      z-index: 1;
      transition: opacity 1.2s ease;
    }

    .moon::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      box-shadow: inset -18px -10px 0 rgba(0, 0, 0, 0.08);
      opacity: 0.5;
    }

    .stars,
    .petals,
    .tree {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.35);
      animation: twinkle linear infinite;
      opacity: 0.4;
    }

    @keyframes twinkle {
      0%, 100% {
        transform: scale(1);
        opacity: 0.25;
      }
      50% {
        transform: scale(1.8);
        opacity: 0.9;
      }
    }

    .content-wrap {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(760px, calc(100vw - 32px));
      padding: 42px 32px;
      text-align: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      transition:
        transform 0.7s ease,
        background 0.7s ease,
        border-color 0.7s ease,
        box-shadow 0.7s ease;
    }

    .title {
      margin: 0 0 14px;
      font-size: clamp(34px, 6vw, 62px);
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #fff8fc;
      text-shadow: 0 0 20px rgba(255, 220, 235, 0.08);
    }

    .subtitle {
      margin: 0 auto 28px;
      max-width: 560px;
      font-size: clamp(15px, 2.2vw, 19px);
      line-height: 1.6;
      color: var(--muted);
    }

    .open-btn {
      appearance: none;
      border: 1px solid var(--button-border);
      background: linear-gradient(
        180deg,
        rgba(255, 236, 244, 0.18),
        rgba(255, 211, 230, 0.1)
      );
      color: #fff9fb;
      font: inherit;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 14px 26px;
      border-radius: 999px;
      cursor: pointer;
      transition:
        transform 0.2s ease,
        background 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease;
      box-shadow: 0 8px 30px rgba(255, 195, 220, 0.08);
    }

    .open-btn:hover {
      transform: translateY(-2px);
      background: linear-gradient(
        180deg,
        rgba(255, 236, 244, 0.24),
        rgba(255, 211, 230, 0.16)
      );
      border-color: rgba(255, 220, 235, 0.4);
      box-shadow: 0 12px 34px rgba(255, 195, 220, 0.14);
    }

    .message {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateY(18px);
      transition:
        max-height 1s ease,
        opacity 1s ease,
        transform 1s ease,
        margin-top 1s ease;
      margin-top: 0;
    }

    .message.show {
      max-height: 600px;
      opacity: 1;
      transform: translateY(0);
      margin-top: 28px;
    }

    .message p {
      margin: 0 0 16px;
      font-size: clamp(16px, 2.1vw, 21px);
      line-height: 1.8;
      color: #fff7fb;
    }

    .signature {
      margin-top: 18px;
      font-size: 15px;
      color: rgba(255, 242, 248, 0.65);
      letter-spacing: 0.08em;
    }

    .tree {
      opacity: 0;
      transition: opacity 1.2s ease;
      z-index: 1;
    }

    .tree.show {
      opacity: 1;
    }

    .branch {
      position: absolute;
      background: linear-gradient(180deg, #251923 0%, #120d14 100%);
      border-radius: 999px;
      transform-origin: left center;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.18);
    }

    .branch::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), transparent);
      opacity: 0.35;
    }

    .blossom-cluster {
      position: absolute;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      filter: blur(0.1px);
      opacity: 0;
      transform: scale(0.6);
    }

    .tree.show .blossom-cluster {
      animation: bloom 1.8s ease forwards;
    }

    @keyframes bloom {
      0% {
        opacity: 0;
        transform: scale(0.45);
      }
      60% {
        opacity: 1;
        transform: scale(1.05);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .flower {
      position: absolute;
      width: 18px;
      height: 18px;
      transform: rotate(var(--rot, 0deg));
    }

    .flower::before,
    .flower::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .flower::before {
      background:
        radial-gradient(circle at 50% 50%, #fff3a9 0 12%, transparent 13%),
        radial-gradient(circle at 50% 16%, #ffe6f0 0 35%, transparent 36%),
        radial-gradient(circle at 84% 50%, #ffd7e8 0 35%, transparent 36%),
        radial-gradient(circle at 50% 84%, #ffcfe1 0 35%, transparent 36%),
        radial-gradient(circle at 16% 50%, #ffddee 0 35%, transparent 36%);
      box-shadow: 0 0 10px rgba(255, 211, 233, 0.15);
    }

    .flower::after {
      width: 6px;
      height: 6px;
      left: 6px;
      top: 6px;
      background: #f5df7b;
      box-shadow: 0 0 6px rgba(245, 223, 123, 0.4);
    }

    .petal {
      position: absolute;
      top: -10%;
      width: 14px;
      height: 10px;
      opacity: 0;
      border-radius: 70% 30% 70% 30% / 60% 40% 60% 40%;
      background: linear-gradient(135deg, #ffeaf2 0%, #ffd3e4 45%, #f4b8d3 100%);
      box-shadow:
        inset -1px -1px 2px rgba(188, 92, 130, 0.18),
        0 0 8px rgba(255, 213, 231, 0.2);
      transform: rotate(0deg);
    }

    .petals.active .petal {
      opacity: 0.92;
      animation-name: fall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    @keyframes fall {
      0% {
        transform: translate3d(0, -12vh, 0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.95;
      }
      100% {
        transform: translate3d(var(--drift, 80px), 110vh, 0) rotate(540deg);
        opacity: 0.15;
      }
    }

    .glow {
      position: absolute;
      left: 6%;
      bottom: -12%;
      width: 560px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 182, 214, 0.11), transparent 65%);
      opacity: 0;
      filter: blur(14px);
      transition: opacity 1.2s ease;
      z-index: 0;
    }

    .glow.show {
      opacity: 1;
    }

    .opened .card {
      background: rgba(14, 16, 28, 0.44);
      border-color: rgba(255, 220, 235, 0.12);
      box-shadow:
        0 18px 60px rgba(0, 0, 0, 0.4),
        0 0 60px rgba(255, 205, 226, 0.04);
    }

    .opened .subtitle {
      color: rgba(255, 241, 247, 0.78);
    }

    @media (max-width: 700px) {
      .moon {
        width: 82px;
        height: 82px;
        top: 42px;
        right: 28px;
      }

      .card {
        padding: 34px 22px;
        border-radius: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <div class="moon"></div>

    <div class="stars" id="stars"></div>

    <div class="tree" id="tree">
      <div class="branch" style="left:-40px; bottom:108px; width:420px; height:14px; transform:rotate(-10deg);"></div>
      <div class="branch" style="left:170px; bottom:210px; width:220px; height:10px; transform:rotate(-38deg);"></div>
      <div class="branch" style="left:138px; bottom:172px; width:180px; height:10px; transform:rotate(-3deg);"></div>
      <div class="branch" style="left:210px; bottom:145px; width:170px; height:8px; transform:rotate(24deg);"></div>
      <div class="branch" style="left:-20px; bottom:158px; width:240px; height:10px; transform:rotate(-28deg);"></div>

      <div class="blossom-cluster" style="left:170px; bottom:210px; animation-delay:0.1s;"></div>
      <div class="blossom-cluster" style="left:245px; bottom:250px; animation-delay:0.4s;"></div>
      <div class="blossom-cluster" style="left:285px; bottom:180px; animation-delay:0.7s;"></div>
      <div class="blossom-cluster" style="left:85px; bottom:220px; animation-delay:0.55s;"></div>
      <div class="blossom-cluster" style="left:110px; bottom:140px; animation-delay:0.9s;"></div>
    </div>

    <div class="glow" id="glow"></div>
    <div class="petals" id="petals"></div>

    <div class="content-wrap">
      <div class="card">
        <h1 class="title">С 8 марта, любимая...</h1>
        <p class="subtitle">
          Для девушки, которая принесла в мою тьму что-то по-настоящему живое.
        </p>

        <button class="open-btn" id="openBtn">Открыть</button>

        <div class="message" id="message">
          <p>
            Зимний сад в душе.
          </p>
          <p>
            Ветка сакуры в снегу —
          </p>
          <p>
            Твой взгляд распустил.
          </p>
          <!-- <p>
            С 8 марта, моя хорошая.
          </p> -->

          <div class="signature"> <i>— Японский поэт Мишао Масидзаки</i></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const stars = document.getElementById("stars");
    const petals = document.getElementById("petals");
    const tree = document.getElementById("tree");
    const glow = document.getElementById("glow");
    const openBtn = document.getElementById("openBtn");
    const message = document.getElementById("message");
    const scene = document.getElementById("scene");
    const blossomClusters = document.querySelectorAll(".blossom-cluster");

    function createStars(count = 70) {
      for (let i = 0; i < count; i++) {
        const star = document.createElement("div");
        star.className = "star";
        star.style.left = Math.random() * 100 + "vw";
        star.style.top = Math.random() * 100 + "vh";
        const size = Math.random() * 2.2 + 1;
        star.style.width = size + "px";
        star.style.height = size + "px";
        star.style.animationDuration = (2.4 + Math.random() * 4.6) + "s";
        star.style.animationDelay = (Math.random() * 4) + "s";
        star.style.opacity = String(0.18 + Math.random() * 0.68);
        stars.appendChild(star);
      }
    }

    function populateCluster(cluster, flowersCount = 18) {
      for (let i = 0; i < flowersCount; i++) {
        const flower = document.createElement("div");
        flower.className = "flower";
        const angle = Math.random() * Math.PI * 2;
        const radius = 12 + Math.random() * 38;
        const x = 46 + Math.cos(angle) * radius;
        const y = 46 + Math.sin(angle) * radius;
        flower.style.left = x + "px";
        flower.style.top = y + "px";
        flower.style.setProperty("--rot", `${Math.random() * 360}deg`);
        flower.style.transform += ` scale(${0.8 + Math.random() * 0.6})`;
        cluster.appendChild(flower);
      }
    }

    function createPetals(count = 24) {
      for (let i = 0; i < count; i++) {
        const petal = document.createElement("div");
        petal.className = "petal";
        petal.style.left = Math.random() * 100 + "vw";
        petal.style.animationDuration = (10 + Math.random() * 10) + "s";
        petal.style.animationDelay = Math.random() * 10 + "s";
        petal.style.setProperty(
          "--drift",
          `${-140 + Math.random() * 280}px`
        );
        petal.style.width = (10 + Math.random() * 9) + "px";
        petal.style.height = (8 + Math.random() * 6) + "px";
        petals.appendChild(petal);
      }
    }

    createStars();
    createPetals();
    blossomClusters.forEach((cluster, index) => {
      populateCluster(cluster, 16 + (index % 3) * 4);
    });

    openBtn.addEventListener("click", () => {
      message.classList.add("show");
      tree.classList.add("show");
      petals.classList.add("active");
      glow.classList.add("show");
      scene.classList.add("opened");
      openBtn.style.display = "none";
    });
  </script>
</body>
</html>
