<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Рите ✿</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; overflow:hidden;
  background:#04010e;
  font-family:'Cormorant Garamond',serif;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
#c { position:fixed; inset:0; z-index:0; }
#tree-layer { position:fixed; inset:0; z-index:1; pointer-events:none; }
#petals-layer { position:fixed; inset:0; z-index:2; }

/* ── OVERLAY ── */
#overlay {
  position:fixed; inset:0; z-index:50;
  display:flex; align-items:center; justify-content:center;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.3s;
}
#overlay.show { pointer-events:all; opacity:1; }

#big-wrap {
  position:relative;
  display:flex; align-items:center; justify-content:center;
  transform:scale(0);
  transition:transform 0.55s cubic-bezier(.175,.885,.32,1.275);
}
#overlay.show #big-wrap { transform:scale(1); }
#overlay.closing #big-wrap {
  transform:scale(0.04) translate(var(--fly-x), var(--fly-y)) rotate(var(--fly-r));
  transition:transform 0.55s cubic-bezier(.55,.06,.68,.19);
}

#big-svg {
  display:block;
  transform: rotate(90deg);
  transform-origin: center center;
  position:absolute;
  inset:0;
  margin:auto;
  width:131.25vw;
  height:auto;
}

#petal-msg {
  position:absolute;
  inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  text-align:center;
  /* SVG лепестка повёрнут на 90°: его острые концы теперь слева/справа.
     Поэтому отступы по бокам (left/right) защищают от острых краёв,
     а top/bottom — от широкой части. */
  padding:20% 30% 24%;
}
#petal-msg .msg {
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:clamp(1.3rem,5vw,2.1rem);
  color:#5a0f22;
  line-height:1.55;
  width:68.75vw;
  height:auto;
  font-weight:300;
}
#petal-msg .tap-hint {
  margin-top:1.2em;
  font-size:clamp(0.6rem,2vw,0.78rem);
  color:rgba(100,30,50,0.5);
  letter-spacing:0.14em;
  font-style:italic;
}

/* ── HINT ── */
#hint {
  position:fixed; bottom:4%; left:50%; transform:translateX(-50%);
  z-index:10; pointer-events:none;
  font-family:'Cormorant Garamond',serif; font-style:italic;
  font-size:clamp(0.68rem,2vw,0.9rem);
  color:rgba(255,185,205,0.45);
  letter-spacing:0.08em; white-space:nowrap;
  animation:pulse 3s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:.9}}

/* ── BIRTHDAY LINE ── */
#bday {
  position:fixed; top:5%; left:50%; transform:translateX(-50%);
  z-index:10; pointer-events:none;
  font-family:'Cormorant Garamond',serif; font-style:italic;
  font-size:clamp(0.9rem,3vw,1.3rem);
  color:rgba(255,200,215,0.6);
  letter-spacing:0.12em; white-space:nowrap;
  text-shadow:0 0 20px rgba(255,140,170,0.3);
  animation:pulse 4s ease-in-out infinite;
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- TREE drawn on canvas below, SVG layer for extra blossoms -->
<div id="tree-layer"></div>
<div id="petals-layer"></div>

<div id="overlay">
  <div id="big-wrap">
    <svg id="big-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="petal-msg">
      <div class="msg" id="msg-text"></div>
      <div class="tap-hint">коснись, чтобы отпустить</div>
    </div>
  </div>
</div>

<div id="bday">С Днём Рождения, моя любимая ✿</div>
<div id="hint">✿ нажимай на лепестки ✿</div>

<script>
/* ═══════════════════════
   MESSAGES
═══════════════════════ */
const allMessages = [
  "Твоя мизантропия — это самая изысканная форма святости",
  "Ты — моя любимая катастрофа, в эпицентре которой я обрёл покой",
  "Твои глаза - шторм бездны, который завораживает больше, чем мир в огне",
  "Твой смех - музыка для моих ушей",
  "Ты — мой личный теологический аргумент в мире, где Бога нет",
  "Ты сочетаешь в себе несочетаемое, и я так люблю твою многогранность",
  "Ты так красива, что порой мне кажется что ты нереальна, ведь я мечтал о тебе",
  "Мы — совпадение двух монстров, которое выглядит как нежность",
  "Ты — самое убедительное доказательство того, что красота рукотворна и от этого священна",
  "Твоя грация — это хищная плавность пантеры перед прыжком",
  "Твои губы вызывают бурю желания и нежности",
  "Твой облик — это утонченная готическая скульптура, которая дышит",
  "Ты не веришь в добродетель, но твоя честность целомудреннее лживого добра",
  "Ты весна моей жизни. Спасибо тебе за тепло и за холод",
  "Ты — тот самый волнующий и опасный космос, в который хочется падать",
  "Обожаю как ты ненавидишь остальных. Моя хищница",
  "Твой ум — это скальпель, и я доверяю тебе свои старые раны",
  "Я тебя просто обожаю. Я не могу представить свою жизнь без тебя, моя любовь",
  "В твоей голове лабиринты, по которым я готов бродить вечность",
  "Ты чувствуешь меня без кожи, без слов, без лжи",
  "Ты Восхитительна до такой степени, что я не могу найти слов для того чтобы описать это",
  "Ты — сама диалектика: любишь и ненавидишь с одинаковой, божественной силой",
  "Ты моя неизбежная любовь. Ты не оставила мне и шанса не влюбиться в тебя",
  "С тобой мы — заговор двоих против бессмысленности мира",
  "Ты доказала мне, что я умею любить, просто став собой",
  "Ты — единственный человек, кто читает мою аритмию как ноты"
];
let pool = [...allMessages].sort(() => Math.random() - 0.5);

/* ═══════════════════════
   CANVAS — sky, moon, tree
═══════════════════════ */
const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, T = 0;

function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
resize(); addEventListener('resize', resize);

const stars = Array.from({length: 260}, () => ({
  x: Math.random(), y: Math.random() * 0.78,
  r: Math.random() * 1.5 + 0.2,
  base: Math.random() * 0.5 + 0.1,
  ph: Math.random() * Math.PI * 2,
  spd: Math.random() * 0.5 + 0.12,
  col: Math.random() > 0.85 ? '#ffeedd' : Math.random() > 0.5 ? '#fff' : '#dde8ff'
}));

let mg = 0, mgd = 1;

/* tree structure */
function drawTree(ctx, W, H) {
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // trunk colour
  const trunkCol = '#120804';

  function branch(x, y, angle, len, width, depth) {
    if (depth === 0 || len < 3) return;
    const ex = x + Math.cos(angle) * len;
    const ey = y + Math.sin(angle) * len;

    ctx.strokeStyle = depth > 2 ? trunkCol : '#1a0c06';
    ctx.lineWidth = width;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey); ctx.stroke();

    // blossoms at tips
    if (depth <= 2) {
      const count = 3 + Math.floor(Math.random() * 4);
      for (let i = 0; i < count; i++) {
        drawBlossom(ctx,
          ex + (Math.random()-0.5)*len*0.6,
          ey + (Math.random()-0.5)*len*0.6,
          4 + Math.random() * 6
        );
      }
    }

    const spread = 0.38 + depth * 0.04;
    const lenScale = 0.68 + Math.random() * 0.08;
    branch(ex, ey, angle - spread,        len * lenScale,        width * 0.65, depth - 1);
    branch(ex, ey, angle + spread * 0.8,  len * lenScale * 0.9,  width * 0.6,  depth - 1);
    if (depth > 3) {
      branch(ex, ey, angle - spread*0.2,  len * lenScale * 0.85, width * 0.55, depth - 1);
    }
  }

  // seed randomness for consistent tree
  Math.seedrandom = null; // we use precomputed angles
  const baseX = W * 0.5, baseY = H;
  const treeH  = H * 0.62;

  // main trunk
  branch(baseX, baseY,       -Math.PI/2,          treeH * 0.35, W*0.025, 7);
  branch(baseX + W*0.005, baseY - treeH*0.08,
                             -Math.PI/2 + 0.1,    treeH * 0.28, W*0.018, 6);

  ctx.restore();
}

function drawBlossom(ctx, x, y, r) {
  const petalCount = 5;
  for (let i = 0; i < petalCount; i++) {
    const a = (i / petalCount) * Math.PI * 2;
    const px = x + Math.cos(a) * r * 0.55;
    const py = y + Math.sin(a) * r * 0.55;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(a);
    // choose pink shade
    const light = 70 + Math.random() * 20;
    ctx.fillStyle = `hsla(340, 65%, ${light}%, 0.82)`;
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.45, r * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  // centre
  ctx.fillStyle = 'rgba(255,230,100,0.7)';
  ctx.beginPath(); ctx.arc(x, y, r*0.18, 0, Math.PI*2); ctx.fill();
}

// Pre-render tree to offscreen canvas (so blossoms are static, not redrawn every frame)
let treeCanvas = null;
function buildTreeCanvas() {
  treeCanvas = document.createElement('canvas');
  treeCanvas.width  = W;
  treeCanvas.height = H;
  const tc = treeCanvas.getContext('2d');
  drawTree(tc, W, H);
}
buildTreeCanvas();
addEventListener('resize', buildTreeCanvas);

function drawFrame() {
  ctx.clearRect(0, 0, W, H);

  // sky gradient — deep indigo/purple night
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0,    '#010009');
  sky.addColorStop(0.35, '#04000f');
  sky.addColorStop(0.65, '#080218');
  sky.addColorStop(0.85, '#0f052a');
  sky.addColorStop(1,    '#1a0a38');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  // stars
  stars.forEach(s => {
    const a = s.base + Math.sin(T * s.spd + s.ph) * 0.2;
    if (a <= 0) return;
    ctx.save(); ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = s.col;
    ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2); ctx.fill();
    if (s.r > 1.05 && a > 0.42) {
      ctx.globalAlpha = a * 0.18; ctx.strokeStyle = s.col; ctx.lineWidth = 0.35;
      ctx.beginPath();
      ctx.moveTo(s.x*W - s.r*4, s.y*H); ctx.lineTo(s.x*W + s.r*4, s.y*H);
      ctx.moveTo(s.x*W, s.y*H - s.r*4); ctx.lineTo(s.x*W, s.y*H + s.r*4);
      ctx.stroke();
    }
    ctx.restore();
  });

  // moon — cold lavender-white
  mg += 0.006 * mgd; if (mg > 1 || mg < 0) mgd *= -1;
  const mx = W*0.8, my = H*0.12, mr = Math.min(W,H)*0.07;
  const g1 = ctx.createRadialGradient(mx,my,mr*0.3,mx,my,mr*4.5);
  g1.addColorStop(0, `rgba(230,215,255,${0.13+mg*0.04})`);
  g1.addColorStop(0.5, `rgba(190,170,240,${0.05+mg*0.02})`);
  g1.addColorStop(1, 'rgba(150,130,200,0)');
  ctx.fillStyle = g1; ctx.beginPath(); ctx.arc(mx,my,mr*4.5,0,Math.PI*2); ctx.fill();
  const g2 = ctx.createRadialGradient(mx-mr*0.28,my-mr*0.28,mr*0.06,mx,my,mr);
  g2.addColorStop(0,'#fafaff'); g2.addColorStop(0.38,'#eae0ff');
  g2.addColorStop(0.8,'#c8b8f0'); g2.addColorStop(1,'#a090cc');
  ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(mx,my,mr,0,Math.PI*2); ctx.fill();
  [[0.28,-0.22,0.09],[-0.12,0.3,0.062],[0.46,0.18,0.048]].forEach(([dx,dy,cr]) => {
    ctx.fillStyle='rgba(140,118,185,0.2)';
    ctx.beginPath(); ctx.arc(mx+dx*mr,my+dy*mr,cr*mr,0,Math.PI*2); ctx.fill();
  });

  // tree (pre-rendered)
  if (treeCanvas) ctx.drawImage(treeCanvas, 0, 0);

  // ground mist
  const fog = ctx.createLinearGradient(0, H*0.58, 0, H);
  fog.addColorStop(0, 'rgba(0,0,0,0)');
  fog.addColorStop(0.4, 'rgba(6,0,18,0.4)');
  fog.addColorStop(1, 'rgba(10,0,25,0.9)');
  ctx.fillStyle = fog; ctx.fillRect(0, H*0.58, W, H*0.42);

  T += 0.012;
  requestAnimationFrame(drawFrame);
}
drawFrame();

/* ═══════════════════════
   FLOATING PETALS
═══════════════════════ */
const layer = document.getElementById('petals-layer');
const floaters = [];
let pid = 0;

function petalPath(w, h) {
  const hw = w/2;
  return `M${hw},${h} C${hw*0.08},${h*0.75} ${-hw*0.15},${h*0.35} ${hw},0 C${hw*1.15},${h*0.35} ${hw*1.92},${h*0.75} ${hw},${h}Z`;
}

const colors = [
  [255,195,210, 0.82], [255,178,198, 0.78],
  [245,160,182, 0.74], [255,218,228, 0.8],
  [250,170,190, 0.76],
];

function makeSVG(w, h, col, uid) {
  const [r,g,b,a] = col;
  const p = petalPath(w, h);
  const id = `p${uid}`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="${id}" cx="50%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="rgba(${Math.min(255,r+35)},${Math.min(255,g+25)},${Math.min(255,b+20)},${a})"/>
      <stop offset="55%"  stop-color="rgba(${r},${g},${b},${a*0.92})"/>
      <stop offset="100%" stop-color="rgba(${Math.max(0,r-25)},${Math.max(0,g-20)},${Math.max(0,b-15)},${a*0.8})"/>
    </radialGradient>
    <radialGradient id="sh${id}" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <path d="${p}" fill="url(#${id})"/>
  <path d="${p}" fill="url(#sh${id})"/>
  <path d="M${w/2},${h} C${w/2},${h*0.6} ${w/2},${h*0.3} ${w/2},0"
    stroke="rgba(255,190,205,0.18)" stroke-width="${Math.max(0.5,w*0.018)}" fill="none"/>
</svg>`;
}

function spawnPetal() {
  const uid = pid++;
  const big = pool.length > 0 && Math.random() < 0.5;
  const size = big ? 44 + Math.random()*30 : 12 + Math.random()*18;
  const w = size, h = size * 1.6;
  const col = colors[Math.floor(Math.random()*colors.length)];

  const el = document.createElement('div');
  el.style.cssText = `position:absolute;width:${w}px;height:${h}px;cursor:${big?'pointer':'default'};`;
  el.innerHTML = makeSVG(w, h, col, uid);
  if (big) el.style.filter = 'drop-shadow(0 2px 8px rgba(255,150,180,0.4))';

  const x0 = Math.random() * W;
  const y0 = -h - Math.random() * 100;
  el.style.left = x0 + 'px';
  el.style.top  = y0 + 'px';

  layer.appendChild(el);

  const fd = {
    el, x: x0, y: y0, rot: Math.random()*360,
    rotSpd: (Math.random()-0.5)*160,
    fallSpd: 30 + Math.random()*50,
    wobA: 18 + Math.random()*35,
    wobF: 0.35 + Math.random()*0.55,
    phase: Math.random()*Math.PI*2,
    w, h, big, alive: true, uid
  };
  floaters.push(fd);

  if (big) {
    el.addEventListener('click',    e => { e.stopPropagation(); openPetal(fd); });
    el.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); openPetal(fd); });
  }
}

let lastTs = 0;
function animPetals(ts) {
  const dt = Math.min((ts - lastTs)/1000, 0.05);
  lastTs = ts;
  for (let i = floaters.length-1; i >= 0; i--) {
    const p = floaters[i];
    if (!p.alive) { floaters.splice(i,1); continue; }
    p.y += p.fallSpd * dt;
    p.x += Math.sin(ts*0.001*p.wobF + p.phase) * p.wobA * dt;
    p.rot += p.rotSpd * dt;
    p.el.style.top  = p.y + 'px';
    p.el.style.left = p.x + 'px';
    p.el.style.transform = `rotate(${p.rot}deg)`;
    if (p.y > H + 80) { p.el.remove(); p.alive=false; floaters.splice(i,1); }
  }
  requestAnimationFrame(animPetals);
}
requestAnimationFrame(animPetals);

// spawn loop
for (let i=0; i<20; i++) setTimeout(spawnPetal, i*120);
setInterval(() => { for(let i=0;i<2;i++) spawnPetal(); }, 700);

/* ═══════════════════════
   OVERLAY
═══════════════════════ */
const overlay  = document.getElementById('overlay');
const bigWrap  = document.getElementById('big-wrap');
const bigSVG   = document.getElementById('big-svg');
const msgEl    = document.getElementById('msg-text');
let overlayOpen = false;
let activeFd    = null;

function openPetal(fd) {
  if (overlayOpen || pool.length === 0) return;
  overlayOpen = true;
  activeFd = fd;
  fd.el.style.opacity = '0';

  const msg = pool.shift();
  msgEl.textContent = msg;

  // Лепесток поворачивается на 90°: длинная ось становится горизонтальной.
  // bw — ширина SVG (короткая), bh — высота SVG (длинная).
  // После rotate(90deg): визуальная ширина = bh, высота = bw.
  const maxVisW = Math.min(W * 0.82, 520);
  const maxVisH = Math.min(H * 0.65, 380);
  let bw, bh;
  if (maxVisW / 1.6 <= maxVisH) { bh = maxVisW; bw = bh / 1.6; }
  else                           { bw = maxVisH; bh = bw * 1.6; }

  // fresh colour
  const col = [255, 200, 215, 0.93];
  const path = petalPath(bw, bh);
  const uid  = 'big';
  const [r,g,b,a] = col;
  bigSVG.setAttribute('width',  bw);
  bigSVG.setAttribute('height', bh);
  bigSVG.setAttribute('viewBox', `0 0 ${bw} ${bh}`);
  bigSVG.innerHTML = `
    <defs>
      <radialGradient id="gbig" cx="50%" cy="30%" r="70%">
        <stop offset="0%"   stop-color="rgba(255,228,235,0.96)"/>
        <stop offset="55%"  stop-color="rgba(${r},${g},${b},0.92)"/>
        <stop offset="100%" stop-color="rgba(235,165,185,0.88)"/>
      </radialGradient>
      <radialGradient id="shbig" cx="50%" cy="18%" r="75%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
      </radialGradient>
    </defs>
    <path d="${path}" fill="url(#gbig)"/>
    <path d="${path}" fill="url(#shbig)"/>
    <path d="M${bw/2},${bh} C${bw/2},${bh*0.6} ${bw/2},${bh*0.28} ${bw/2},0"
      stroke="rgba(220,160,178,0.22)" stroke-width="${bw*0.015}" fill="none"/>
  `;

  // SVG рисуется как bw×bh (вертикальный), но повёрнут на 90°.
  // Визуально контейнер занимает bh × bw (горизонтальный лепесток).
  bigWrap.style.width  = bh + 'px';
  bigWrap.style.height = bw + 'px';

  // reset closing vars
  bigWrap.style.setProperty('--fly-x','0px');
  bigWrap.style.setProperty('--fly-y','0px');
  bigWrap.style.setProperty('--fly-r','0deg');
  bigWrap.classList.remove('closing'); // ensure clean state

  overlay.classList.add('show');
}

function closePetal() {
  if (!overlayOpen) return;
  overlayOpen = false;

  const flyX = (Math.random()-0.5) * 600;
  const flyY = 400 + Math.random()*300;
  const flyR = (Math.random()-0.5)*120;
  bigWrap.style.setProperty('--fly-x', flyX+'px');
  bigWrap.style.setProperty('--fly-y', flyY+'px');
  bigWrap.style.setProperty('--fly-r', flyR+'deg');
  bigWrap.classList.add('closing');

  setTimeout(() => {
    overlay.classList.remove('show');
    bigWrap.classList.remove('closing');
    if (activeFd) { activeFd.el.remove(); activeFd.alive=false; activeFd=null; }
  }, 580);
}

overlay.addEventListener('click',    closePetal);
overlay.addEventListener('touchend', e => { e.preventDefault(); closePetal(); });
</script>
</body>
</html>
